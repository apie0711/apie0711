    <path d="M1 59H1439M1 592H1439" stroke="#2B3846"/>
    <rect x="1" y="1" width="1438" height="58" fill="#111A26"/>
    <circle cx="33" cy="30" r="5" fill="#E9918D"/><circle cx="52" cy="30" r="5" fill="#E8C074"/><circle cx="71" cy="30" r="5" fill="#73F0C7"/>
    <text x="96" y="35" fill="#B7C8D6" font-size="13" letter-spacing="1.1" class="mono">apie0711 / personal-lab</text>
    <rect x="1194" y="18" width="214" height="26" rx="13" fill="#172F2B"/>
    <circle cx="1211" cy="31" r="3" fill="#73F0C7"/>
    <text x="1223" y="35" fill="#96EBCF" font-size="10" letter-spacing="1.2" class="mono">LEARNING IN PROGRESS</text>
    <path d="M38 83H54M38 83V99M1386 83H1402M1402 83V99M38 568H54M38 552V568M1386 568H1402M1402 552V568" stroke="#455D6C"/>
    <text x="65" y="132" fill="#8C9FAC" font-size="12" letter-spacing="4" class="mono">SOFTWARE × EMBEDDED × HARDWARE</text>
    <text x="60" y="237" fill="#F1F6F3" font-size="107" font-weight="700" letter-spacing="-7" class="sans">APIE0711<tspan fill="#73F0C7">.</tspan></text>
    <text x="65" y="285" fill="#73F0C7" font-size="29" font-weight="600" letter-spacing="-.8" class="sans">From code to circuits.</text>
    <rect x="64" y="331" width="619" height="197" rx="12" fill="#111B27" stroke="#2A3A47"/>
    <path d="M65 367H682" stroke="#2A3A47"/>
    <text x="85" y="354" fill="#8299AA" font-size="11" letter-spacing="1.5" class="mono">TERMINAL</text>
    <text x="660" y="354" fill="#547466" font-size="10" text-anchor="end" class="mono">~/curiosity</text>
    <g class="mono" font-size="15">
      <text x="86" y="399" fill="#EEF4F4"><tspan fill="#73F0C7">$ </tspan>whoami</text>
      <text x="104" y="427" fill="#A5B6C6">software student, hardware enthusiast</text>
      <text x="86" y="466" fill="#EEF4F4"><tspan fill="#73F0C7">$ </tspan>./build --learn</text>
      <text x="104" y="494" fill="#A5B6C6">write code. test ideas. understand.</text>
    </g>
    <rect x="441" y="481" width="8" height="16" fill="#73F0C7" class="motion"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
