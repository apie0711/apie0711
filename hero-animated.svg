      <circle r="8"><animateMotion path="M827 172H929L981 224H1012" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="8"><animateMotion path="M1197 342H1262L1318 398H1380" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="957" y="202" width="270" height="255" rx="29" stroke="#244942"/>
    <rect x="949" y="194" width="286" height="271" rx="35" stroke="#254940" stroke-dasharray="2 9"/>
    <path d="M968 235V216H989M1194 216H1216V238M968 420V442H989M1194 442H1216V420" stroke="#73F0C7" stroke-width="2"/>
