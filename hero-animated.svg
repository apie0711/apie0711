      <circle r="4"><animateMotion path="M812 368H884L937 315H986" dur="4s" begin="-.9s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M919 526H982L1034 474V433" dur="4s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M1197 267H1275L1327 215H1378" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M1197 342H1262L1318 398H1380" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="4"><animateMotion path="M1141 433V474L1171 504H1246" dur="4s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>
