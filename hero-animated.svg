<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">APIE0711 — a personal development lab</title>
  <desc id="desc">An animated development console. A terminal on the left and signals travelling through a circuit board on the right connect software, Linux and embedded hardware.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26313E"/></pattern>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6H6" stroke="#79E4C4" stroke-opacity=".035"/></pattern>
    <linearGradient id="chip" x1="967" y1="214" x2="1217" y2="456" gradientUnits="userSpaceOnUse"><stop stop-color="#142F32"/><stop offset="1" stop-color="#101B27"/></linearGradient>
    <linearGradient id="horizon"><stop stop-color="#73F0C7" stop-opacity="0"/><stop offset=".5" stop-color="#73F0C7"/><stop offset="1" stop-color="#73F0C7" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="round"><rect width="1440" height="650" rx="22"/></clipPath>
    <style>.sans{font-family:DejaVu Sans,Arial,sans-serif}.mono{font-family:DejaVu Sans Mono,monospace}@media (prefers-reduced-motion:reduce){.motion{display:none}}</style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1440" height="650" fill="#0B1018"/>
    <rect x="754" y="60" width="686" height="532" fill="url(#dots)"/>
