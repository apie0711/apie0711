    <rect x="1000" y="241" width="186" height="176" rx="10" stroke="#426F63"/>
    <rect x="1000" y="241" width="186" height="176" rx="10" fill="url(#lines)"/>
    <circle cx="1012" cy="253" r="3" fill="#73F0C7"/>
    <path d="M1057 294L1027 326L1057 358M1132 294L1162 326L1132 358M1106 285L1080 366" stroke="#73F0C7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1093" y="400" fill="#A3C7BE" font-size="10" text-anchor="middle" letter-spacing="2.8" class="mono">BUILD / LEARN</text>
    <path d="M1004 265H1182" stroke="url(#horizon)" opacity=".8" class="motion"><animateTransform attributeName="transform" type="translate" values="0 0;0 130;0 0" dur="4s" repeatCount="indefinite"/></path>
    <g class="mono" font-size="11" letter-spacing="1">
      <rect x="769" y="145" width="130" height="54" rx="9" fill="#121D28" stroke="#34564D"/>
      <text x="788" y="168" fill="#829D9B" font-size="9">01 / SOFTWARE</text><text x="788" y="185" fill="#D9EDE4">C / C++</text>
      <rect x="760" y="341" width="126" height="54" rx="9" fill="#121D28" stroke="#34564D"/>
      <text x="777" y="364" fill="#829D9B" font-size="9">02 / SYSTEM</text><text x="777" y="381" fill="#D9EDE4">LINUX</text>
      <rect x="822" y="499" width="147" height="54" rx="9" fill="#121D28" stroke="#34564D"/>
      <text x="839" y="522" fill="#829D9B" font-size="9">03 / HARDWARE</text><text x="839" y="539" fill="#D9EDE4">EMBEDDED</text>
    </g>
    <g fill="#A596EC"><rect x="1269" y="105" width="22" height="22" rx="6"/><circle cx="1378" cy="215" r="4"/><circle cx="1380" cy="398" r="4"/><rect x="1240" y="498" width="13" height="13" rx="3"/></g>
    <path d="M1300 455H1312M1306 449V461M831 251H843M837 245V257" stroke="#708C95" stroke-width="2"/>
    <circle cx="1137" cy="116" r="3" fill="#73F0C7"/>
    <text x="64" y="627" fill="#8098A8" font-size="11" letter-spacing="2.2" class="mono">CURIOUS BY DEFAULT.</text>
    <text x="1378" y="627" fill="#B7CFC7" font-size="11" letter-spacing="2.2" text-anchor="end" class="mono">LEARN. BUILD. REPEAT.</text>
