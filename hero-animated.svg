      <path d="M976 260H1001M976 288H1001M976 316H1001M976 344H1001M976 372H1001M976 400H1001"/>
      <path d="M1186 260H1210M1186 288H1210M1186 316H1210M1186 344H1210M1186 372H1210M1186 400H1210"/>
    </g>
